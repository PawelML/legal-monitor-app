services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: legal_monitor
      POSTGRES_USER: legal_monitor
      POSTGRES_PASSWORD: legal_monitor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_monitor -d legal_monitor"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    env_file:
      - .env
    environment:
      LEGAL_MONITOR_DATABASE_URL: postgresql+asyncpg://legal_monitor:legal_monitor@db:5432/legal_monitor
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
